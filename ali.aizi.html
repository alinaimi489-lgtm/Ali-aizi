<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت من با پنل مدیریت</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #24292e; }
        #post-list .post { background: #f9f9f9; border-right: 4px solid #2ea44f; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .hidden { display: none; }
        input[type="text"], input[type="password"], textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #2ea44f; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-family: inherit; }
        button:hover { background-color: #22863a; }
        .admin-btn { background-color: #0366d6; display: block; margin: 20px auto; }
        .admin-btn:hover { background-color: #005cc5; }
        #admin-panel { border: 2px dashed #0366d6; padding: 20px; margin-top: 20px; border-radius: 10px; background: #f0f8ff; }
    </style>
</head>
<body>

<div class="container">
    <h1>به وب‌سایت من خوش آمدید</h1>

    <!-- بخش نمایش پست‌ها -->
    <div id="post-list">
        <!-- پست‌ها اینجا نمایش داده می‌شوند -->
    </div>

    <!-- دکمه ورود به پنل مدیریت -->
    <button class="admin-btn" onclick="showLogin()">ورود به پنل مدیریت</button>

    <!-- بخش ورود (لاگین) -->
    <div id="login-section" class="hidden" style="text-align: center; margin-top: 20px;">
        <h3>رمز عبور را وارد کنید</h3>
        <input type="password" id="admin-password" placeholder="رمز: 1234">
        <button onclick="login()">ورود</button>
    </div>

    <!-- پنل مدیریت -->
    <div id="admin-panel" class="hidden">
        <h2>پنل مدیریت</h2>
        <input type="text" id="post-title" placeholder="عنوان پست جدید...">
        <textarea id="post-content" rows="4" placeholder="متن پست..."></textarea>
        <button onclick="addPost()">افزودن پست</button>
        <button onclick="logout()" style="background-color: #d73a49; float: left;">خروج</button>
    </div>
</div>

<script>
    // رمز عبور پنل (می‌توانید تغییر دهید)
    const ADMIN_PASSWORD = "1234";
    
    // گرفتن پست‌ها از حافظه مرورگر
    let posts = JSON.parse(localStorage.getItem('mySitePosts')) || [
        { title: "پست اول", content: "این یک پست آزمایشی است که به صورت پیش‌فرض قرار داده شده است." }
    ];

    // نمایش پست‌ها در صفحه
    function renderPosts() {
        const list = document.getElementById('post-list');
        list.innerHTML = '';
        posts.forEach(post => {
            const div = document.createElement('div');
            div.className = 'post';
            div.innerHTML = `<h3>${post.title}</h3><p>${post.content}</p>`;
            list.appendChild(div);
        });
        // ذخیره در حافظه مرورگر
        localStorage.setItem('mySitePosts', JSON.stringify(posts));
    }

    // توابع پنل مدیریت
    function showLogin() {
        document.getElementById('login-section').classList.remove('hidden');
        document.querySelector('.admin-btn').classList.add('hidden');
    }

    function login() {
        const pass = document.getElementById('admin-password').value;
        if (pass === ADMIN_PASSWORD) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
        } else {
            alert("رمز عبور اشتباه است! (رمز پیش‌فرض: 1234)");
        }
    }

    function logout() {
        document.getElementById('admin-panel').classList.add('hidden');
        document.querySelector('.admin-btn').classList.remove('hidden');
        document.getElementById('admin-password').value = '';
    }

    function addPost() {
        const title = document.getElementById('post-title').value;
        const content = document.getElementById('post-content').value;
        
        if (title === "" || content === "") {
            alert("لطفاً عنوان و متن را پر کنید.");
            return;
        }

        posts.unshift({ title: title, content: content }); // اضافه کردن به اول لیست
        renderPosts();
        
        // پاک کردن فرم
        document.getElementById('post-title').value = '';
        document.getElementById('post-content').value = '';
        alert("پست با موفقیت اضافه شد!");
    }

    // اجرای اولیه
    renderPosts();
</script>

</body>
</html>
